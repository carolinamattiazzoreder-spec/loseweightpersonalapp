name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Read app version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = \"\(.*\)\"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/WeightTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WeightTracker-apk
          path: android/app/build/WeightTracker.apk

      # Direct download link for phones: Releases → "WeightTracker APK (latest)"
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: WeightTracker APK (latest)
          make_latest: true
          files: android/app/build/WeightTracker.apk
          body: |
            Latest build of the WeightTracker Android app (commit ${{ github.sha }}, branch ${{ github.ref_name }}).

            Open this page on your phone, tap **WeightTracker.apk**, then open the downloaded file to install
            (allow "install unknown apps" when Android asks).

      # Versioned release (e.g. v1.1) for each version that reaches main
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: WeightTracker ${{ steps.version.outputs.name }}
          make_latest: false
          files: android/app/build/WeightTracker.apk
          body: |
            WeightTracker ${{ steps.version.outputs.name }} for Android (commit ${{ github.sha }}).

            Download **WeightTracker.apk** below on your phone and open it to install or update.
